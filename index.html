/*
====================================================
基础函数
====================================================
*/

function getSeatXPosition(seat) {

  if(seat===1) return "A";
  if(seat===2) return "B";
  if(seat===3) return "C";
  if(seat===4) return "D";

  return "E";
}

function countMap(arr) {

  const map={};

  arr.forEach(v=>{
    map[v]=(map[v]||0)+1;
  });

  return map;
}

function analyzeRoom(roomNumber) {

  const digits=
    roomNumber.split("").map(Number);

  const [A,B,C,D,E]=digits;

  return {
    room:roomNumber,
    digits,
    positions:["A","B","C","D","E"],
    A,B,C,D,E,
    hasZero:digits.includes(0),
    hasRepeat:
      Object.values(countMap(digits))
        .some(v=>v>=2)
  };
}

function getSeatDiffs(room,seat) {

  const xPos=getSeatXPosition(seat);

  const x=room[xPos];

  const diffs=[];

  room.positions.forEach(pos=>{

    if(pos===xPos) return;

    const value=room[pos];

    const absDiff=
      Math.abs(x-value);

    const signedDiff=
      x-value;

    diffs.push({
      pos,
      value,
      absDiff,
      signedDiff
    });

  });

  return {
    seat,
    xPos,
    x,
    diffs,
    allDiffs:
      diffs.map(d=>d.absDiff)
  };
}

function findAbsDiff(room,seat,diff) {

  return getSeatDiffs(room,seat)
    .diffs
    .filter(d=>d.absDiff===diff);
}

function countAbsDiff(room,seat,diff) {

  return findAbsDiff(
    room,
    seat,
    diff
  ).length;
}

function hasDiff(room,seat,diff) {

  return countAbsDiff(
    room,
    seat,
    diff
  )>=1;
}

function hasDoubleDiff(room,seat,diff) {

  return countAbsDiff(
    room,
    seat,
    diff
  )>=2;
}

function hasTripleDiff(room,seat,diff) {

  return countAbsDiff(
    room,
    seat,
    diff
  )>=3;
}

function hasDiffCombo(room,seat,diffs) {

  return diffs.every(diff=>
    hasDiff(room,seat,diff)
  );
}

/*
====================================================
S / L
====================================================
*/

function getSL(room,seat) {

  const diffs=
    getSeatDiffs(room,seat).allDiffs;

  const S=
    diffs.filter(d=>
      d>=0 && d<=4
    ).length;

  const L=
    diffs.filter(d=>
      d>=5 && d<=9
    ).length;

  return {
    S,
    L,
    code:`${S}S${L}L`
  };
}

function isSL(room,seat,S,L) {

  const sl=getSL(room,seat);

  return (
    sl.S===S &&
    sl.L===L
  );
}

====================================================

function getCurrentRules(){

  if(CURRENT_ACCOUNT==="lobster"){
    return LOBSTER_RULES;
  }

  return [
    ...RANZAI_FORMAL_RULES,
    ...RANZAI_WATCH_RULES
  ];
}

/*
====================================================
获取命中
====================================================
*/

function getHits(room,seat){

  return getCurrentRules()
    .filter(rule=>
      rule.test(seat,room)
    )
    .sort((a,b)=>{

      if(a.rank!==b.rank){
        return a.rank-b.rank;
      }

      return a.id.localeCompare(b.id);

    });
}

/*
====================================================
分析座位
====================================================
*/

function analyzeSeats(room){

  const result=[];

  for(let seat=1;seat<=6;seat++){

    const info=
      getSeatDiffs(room,seat);

    const hits=
      getHits(room,seat);

    const formalHits=
      hits.filter(r=>
        r.pool==="formal"
      );

    const watchHits=
      hits.filter(r=>
        r.pool==="watch"
      );

    const sl=
      getSL(room,seat);

    let signalType="none";
    let bestRank=999;

    if(formalHits.length){

      signalType="formal";

      bestRank=
        Math.min(
          ...formalHits.map(r=>r.rank)
        );

    }
    else if(watchHits.length){

      signalType="watch";

      bestRank=
        Math.min(
          ...watchHits.map(r=>r.rank)
        );
    }

    result.push({

      seat,
      xPos:info.xPos,
      x:info.x,
      diffs:info.diffs,
      sl,

      hits,
      formalHits,
      watchHits,

      signalType,

      isCandidate:
        hits.length>0,

      bestRank

    });
  }

  return result;
}

/*
====================================================
推荐排序

正式核优先
观察核其次
====================================================
*/

function choosePicks(seats){

  const formalPicks=
    seats
      .filter(s=>
        s.formalHits.length>0
      )
      .sort((a,b)=>
        a.bestRank!==b.bestRank
          ? a.bestRank-b.bestRank
          : a.seat-b.seat
      );

  const watchOnlyPicks=
    seats
      .filter(s=>
        s.formalHits.length===0 &&
        s.watchHits.length>0
      )
      .sort((a,b)=>
        a.bestRank!==b.bestRank
          ? a.bestRank-b.bestRank
          : a.seat-b.seat
      );

  return {
    formalPicks,
    watchOnlyPicks,
    finalPicks:[
      ...formalPicks,
      ...watchOnlyPicks
    ]
  };
}

function run(){

  const input=
    document.getElementById("roomInput");

  let roomNumber=
    input.value
      .replace(/\D/g,"")
      .slice(0,5);

  input.value=
    roomNumber;

  if(roomNumber.length!==5){

    showError(
      "请输入完整的5位数字房号。"
    );

    return;
  }

  const room=
    analyzeRoom(roomNumber);

  const seats=
    analyzeSeats(room);

  const decision=
    choosePicks(seats);

  renderResult(
    room,
    seats,
    decision
  );

  saveHistory(
    room,
    decision
  );

  renderHistory();
}

function renderDebug(room,seats){

  const rows=
    seats.map(item=>{

      const diffShape=
        item.diffs
          .map(d=>d.absDiff)
          .join("、");

      const count=
        countMap(
          item.diffs.map(
            d=>d.absDiff
          )
        );

      const repeats=
        Object.entries(count)
          .filter(
            ([diff,num])=>num>=2
          )
          .map(
            ([diff,num])=>
              `差${diff}×${num}`
          )
          .join("、")
        ||
        "无双差";

      let status=
        "未命中";

      if(item.formalHits.length){

        status=
          "🔥 "+
          item.formalHits
            .map(r=>r.shortName)
            .join("、");

        if(item.watchHits.length){

          status+=
            "｜🟡 "+
            item.watchHits
              .map(r=>r.shortName)
              .join("、");
        }
      }
      else if(item.watchHits.length){

        status=
          "🟡 "+
          item.watchHits
            .map(r=>r.shortName)
            .join("、");
      }

      return `

        <tr>

          <td>${item.seat}号</td>

          <td>${item.xPos}</td>

          <td>${item.x}</td>

          <td>${diffShape}</td>

          <td>
            <b>
              ${item.sl.S}S${item.sl.L}L
            </b>
          </td>

          <td>${repeats}</td>

          <td>${status}</td>

        </tr>

      `;

    }).join("");

  return `

    <div class="debug">

      <table>

        <thead>

          <tr>

            <th colspan="7">

              房号 ${room.room}
              ｜S=0–4
              ｜L=5–9

            </th>

          </tr>

          <tr>

            <th>位子</th>

            <th>X位置</th>

            <th>X</th>

            <th>四个绝对差</th>

            <th>S/L比例</th>

            <th>重复差</th>

            <th>模型结果</th>

          </tr>

        </thead>

        <tbody>
          ${rows}
        </tbody>

      </table>

    </div>

  `;
}

        <div class="name">

        <div class="rule">

          <b>历史5局5次大赢｜净+4630。</b>
        </div>
      </div>

      <div class="combo main-rule">
        <div class="name">
          🥇 2号｜双差1
        </div>
        <div class="rule">
          四差中差1至少出现2次。
          <br>
          <b>历史2局2正｜净+1600｜0大输。</b>
        </div>
      </div>

      <div class="combo special">
        <div class="name">
          🔥 2号｜差5+差6 + 2S2L
        </div>
        <div class="rule">
          同时存在差5、差6，而且四差必须为2小2大。
          <br>
          <b>历史3局3正｜净+2430｜0大输。</b>
        </div>
      </div>

      <div class="combo main-rule">
        <div class="name">
          🥇 3号｜差7 + 2S2L
        </div>
        <div class="rule">
          必须出现差7，同时满足2S2L。
          <br>
          <b>历史3局3正｜净+1960。</b>
        </div>
      </div>

      <div class="combo special">
        <div class="name">
          🔥 3号超级加强｜双差7 + 2S2L
        </div>
        <div class="rule">

          <br>
          <b>历史2局2次大赢｜净+1780。</b>
        </div>

      <div class="combo special">

          🔥 3号独立爆分核｜差1 + 差7

          <br>

        </div>

      <div class="combo main-rule">
        <div class="name">
          ⭐ 4号｜差1+差2 + 3S1L
        </div>
        <div class="rule">
          同时存在差1、差2，并且为3小1大。
          <br>
          <b>历史2局2正｜净+1720。</b>
        </div>
      </div>

      <div class="combo main-rule">
        <div class="name">
          ⭐ 5号｜差2 + 2S2L
        </div>
        <div class="rule">
          必须出现差2，并且四差为2小2大。
          <br>
          <b>历史2局2正｜净+1050｜0大输。</b>
        </div>
      </div>

      <div class="combo main-rule">
        <div class="name">
          ⭐ 6号｜差6
        </div>
        <div class="rule">
          四差任意位置出现差6。
          <br>
          <b>历史2局2正｜净+1350｜0大输。</b>
        </div>
      </div>

      <div class="combo main-rule">
        <div class="name">
          ⭐ 6号｜差1 + 3S1L
        </div>
        <div class="rule">
          必须出现差1，并且四差为3小1大。
          <br>
          <b>历史3局2正1小负｜净+1430｜0大输。</b>
        </div>
      </div>

    `;

    return;
  }

  /*
  然崽正式池 + 观察池
  */

  const formalHtml=
    RANZAI_FORMAL_RULES
      .map(rule=>`

        <div class="combo ${
          rule.level==="S"
            ? "special"
            : "main-rule"
        }">

          <div class="name">

            ${
              rule.level==="S"
                ? "🔥"
                : "🟢"
            }

            ${rule.name}

          </div>

          <div class="rule">

            <b>${rule.type}</b>

            <br>

            ${rule.stat}

          </div>

        </div>

      `).join("");

  const watchHtml=
    RANZAI_WATCH_RULES
      .map(rule=>`

        <div class="combo ${
          rule.level==="BOOM"
            ? "boom-rule"
            : "watch-rule"
        }">

          <div class="name">

            ${
              rule.level==="BOOM"
                ? "💥"
                : "🟡"
            }

            ${rule.name}

          </div>

          <div class="rule">

            <b>${rule.type}</b>

            <br>

            ${rule.stat}

          </div>

        </div>

      `).join("");

  box.innerHTML=`

    <div
      style="
        font-weight:1000;
        margin:2px 0 8px;
      "
    >
      🔥 正式黄金池
    </div>

    ${formalHtml}

    <div
      style="
        font-weight:1000;
        margin:18px 0 8px;
      "
    >
      🟡 观察池
    </div>

    ${watchHtml}

  `;
}

/*
====================================================
历史记录
两个账号完全独立
====================================================
*/

function getHistoryKey(){

  return ACCOUNTS[
    CURRENT_ACCOUNT
  ].historyKey;
}

function saveHistory(
  room,
  decision
){

  let resultText="跳过";

  if(decision.formalPicks.length){

    resultText=
      "正式："+
      decision.formalPicks
        .map(p=>
          `${p.seat}号(${p.formalHits.map(r=>r.shortName).join("+")})`
        )
        .join("、");

    if(decision.watchOnlyPicks.length){

      resultText+=
        "｜观察："+
        decision.watchOnlyPicks
          .map(p=>
            `${p.seat}号(${p.watchHits.map(r=>r.shortName).join("+")})`
          )
          .join("、");
    }
  }
  else if(
    decision.watchOnlyPicks.length
  ){

    resultText=
      "仅观察："+
      decision.watchOnlyPicks
        .map(p=>
          `${p.seat}号(${p.watchHits.map(r=>r.shortName).join("+")})`
        )
        .join("、");
  }

  const item={

    room:room.room,

    time:
      new Date()
        .toLocaleString(),

    result:resultText

  };

  const key=
    getHistoryKey();

  const list=
    JSON.parse(
      localStorage.getItem(key)
      ||
      "[]"
    );

  list.unshift(item);

  localStorage.setItem(
    key,
    JSON.stringify(
      list.slice(0,50)
    )
  );
}

function renderHistory(){

  const box=
    document.getElementById("historyBox");

  const key=
    getHistoryKey();

  const list=
    JSON.parse(
      localStorage.getItem(key)
      ||
      "[]"
    );

  if(!list.length){

    box.innerHTML=
      "暂无记录";

    return;
  }

  box.innerHTML=
    list.map(item=>`

      <div class="history-item">

        <div class="history-left">
          ${item.room}
        </div>

        <div class="history-right">

          推荐：
          ${item.result}

          <br>

          ${item.time}

        </div>

      </div>

    `).join("");
}

function clearHistory(){

  localStorage.removeItem(
    getHistoryKey()
  );

  renderHistory();
}

document
  .getElementById("roomInput")
  .addEventListener(
    "input",
    event=>{

      event.target.value=
        event.target.value
          .replace(/\D/g,"")
          .slice(0,5);

document
  .getElementById("roomInput")
  .addEventListener(
    "keydown",
    event=>{

      if(event.key==="Enter"){
        run();
      }

    }
  );

*/

renderAccount();
renderHistory();
