<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>抓环机｜房卡规则</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:#f5f1ea;
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang SC",
    "Microsoft YaHei",
    Arial;
    color:#33261d;
}

.container{
    max-width:500px;
    margin:auto;
}

.card{
    background:#fffaf3;
    border-radius:25px;
    padding:25px;
    box-shadow:0 10px 30px rgba(0,0,0,.12);
    margin-bottom:20px;
}

.title{
    text-align:center;
    font-size:28px;
    font-weight:900;
    margin-bottom:10px;
}

.sub{
    text-align:center;
    color:#8a7664;
    margin-bottom:25px;
}


.input-box{
    display:flex;
    gap:10px;
}

input{
    flex:1;
    height:60px;
    border-radius:18px;
    border:2px solid #e5d2bd;
    font-size:28px;
    font-weight:bold;
    text-align:center;
    letter-spacing:5px;
}


button{
    width:70px;
    height:60px;
    border:none;
    border-radius:18px;
    background:#c94b3c;
    color:white;
    font-size:18px;
    font-weight:bold;
}


.result{
    margin-top:25px;
    background:white;
    border-radius:20px;
    padding:20px;
    text-align:center;
}


.result-title{
    color:#888;
    font-size:14px;
}


.number{
    font-size:42px;
    font-weight:1000;
    margin-top:10px;
}


.rule{
    margin-top:15px;
    color:#777;
}


.history-item{
    padding:12px 0;
    border-bottom:1px dashed #ddd;
    display:flex;
    justify-content:space-between;
}


.history-result{
    font-weight:bold;
    color:#c94b3c;
}


.clear{
    width:100%;
    margin-top:15px;
    background:#eee;
    color:#555;
}

</style>

</head>


<body>


<div class="container">


<div class="card">

<div class="title">
抓环机
</div>

<div class="sub">
房卡规则｜房间号 - 49835
</div>


<div class="input-box">

<input 
id="room"
maxlength="5"
inputmode="numeric"
placeholder="输入5位房号">

<button onclick="calc()">
计算
</button>

</div>



<div id="result"></div>


</div>



<div class="card">

<h3>
历史记录
</h3>

<div id="history">
暂无记录
</div>


<button class="clear" onclick="clearHistory()">
清空记录
</button>


</div>


</div>




<script>


const KEY="grab_ring_history";


function calc(){

    let room=document.getElementById("room").value;


    if(room.length!==5 || isNaN(room)){
        alert("请输入5位数字房间号");
        return;
    }


    let num=parseInt(room);


    let result=num-49835;


    document.getElementById("result").innerHTML=`

    <div class="result">

    <div class="result-title">
    ${room} - 49835
    </div>

    <div class="number">
    ${result}
    </div>

    <div class="rule">
    抓环机｜房卡规则
    </div>

    </div>

    `;


    save(room,result);

}



function save(room,result){

    let data=
    JSON.parse(
        localStorage.getItem(KEY)||"[]"
    );


    data.unshift({

        room:room,
        result:result,
        time:new Date()
        .toLocaleString()

    });


    localStorage.setItem(
        KEY,
        JSON.stringify(data.slice(0,50))
    );


    showHistory();

}




function showHistory(){

    let data=
    JSON.parse(
        localStorage.getItem(KEY)||"[]"
    );


    let box=document.getElementById("history");


    if(data.length===0){

        box.innerHTML="暂无记录";
        return;

    }



    box.innerHTML=data.map(item=>`

    <div class="history-item">

    <div>
    ${item.room}
    </div>


    <div class="history-result">
    ${item.result}
    </div>


    </div>


    `).join("");

}



function clearHistory(){

    localStorage.removeItem(KEY);

    showHistory();

}




document
.getElementById("room")
.addEventListener("keydown",
function(e){

    if(e.key==="Enter"){
        calc();
    }

});


showHistory();


</script>


</body>
</html>
