<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>抓环机｜房卡规则</title>
<style>
body{margin:0;padding:20px;background:#f7f3ec;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial;color:#2b2118;overflow-x:hidden}
.wrap{max-width:500px;margin:auto}
.panel{background:#fffaf2;border:1px solid #eadccc;border-radius:24px;box-shadow:0 14px 36px rgba(70,48,28,.12);padding:18px;margin-bottom:16px}
.title{text-align:center;font-size:28px;font-weight:900}
.sub{text-align:center;color:#8a7664;margin:15px}
.input-row{display:flex;flex-direction:column;align-items:center;gap:15px}
input{width:100%;max-width:360px;height:58px;border:2px solid #e7d2c0;border-radius:18px;text-align:center;font-size:28px;font-weight:900;letter-spacing:5px}
button{width:72px;height:72px;border:0;border-radius:50%;background:#d94b3d;color:white;font-weight:900}
.result{display:none;margin-top:18px;background:white;border-radius:20px;padding:18px;text-align:center}
.result.show{display:block}
.big{font-size:32px;font-weight:1000;margin:15px}
.desc{color:#8a7664}
.history-item{display:flex;justify-content:space-between;padding:10px;border-bottom:1px dashed #eadccc}
</style>
</head>
<body>
<div class="wrap">
<div class="panel">
<div class="title">抓环机｜房卡规则</div>
<div class="sub">房间号 - 49835</div>
<div class="input-row">
<input id="roomInput" maxlength="5" inputmode="numeric" placeholder="输入5位房号">
<button onclick="run()">计算</button>
</div>
<div id="result" class="result"></div>
</div>
<div class="panel">
<h3>历史记录</h3>
<div id="history">暂无记录</div>
</div>
</div>
<script>
const KEY="grab_machine_history";
function run(){
 let room=document.getElementById("roomInput").value.replace(/\D/g,"");
 if(room.length!==5){alert("请输入5位数字房间号");return;}
 let result=Number(room)-49835;
 document.getElementById("result").className="result show";
 document.getElementById("result").innerHTML=`<div class="big">${room} - 49835 = ${result}</div><div class="desc">抓环机｜房卡规则</div>`;
 let list=JSON.parse(localStorage.getItem(KEY)||"[]");
 list.unshift({room,result});
 localStorage.setItem(KEY,JSON.stringify(list.slice(0,50)));
 show();
}
function show(){
 let list=JSON.parse(localStorage.getItem(KEY)||"[]");
 document.getElementById("history").innerHTML=list.length?list.map(x=>`<div class="history-item"><span>${x.room}</span><b>${x.result}</b></div>`).join(""):"暂无记录";
}
show();
</script>
</body>
</html>
