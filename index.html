<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>抓环机｜房卡规则</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    width:100%;
    overflow-x:hidden;
}

body{
    margin:0;
    min-height:100vh;
    padding:22px 14px 42px;
    background:#f7f3ec;
    color:#2b2118;
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "PingFang SC",
    "Microsoft YaHei",
    Arial,
    sans-serif;
}


.wrap{
    max-width:980px;
    margin:0 auto;
}


.hero{
    text-align:center;
    margin-bottom:18px;
}


.title{
    font-size:28px;
    font-weight:1000;
    letter-spacing:1px;
    margin:6px 0 8px;
}


.sub{
    color:#8a7664;
    font-size:14px;
    line-height:1.7;
}



.panel{

    background:
    rgba(255,250,242,.94);

    border:1px solid #eadccc;

    border-radius:24px;

    box-shadow:
    0 14px 36px rgba(70,48,28,.12);

    padding:18px;

    margin-bottom:16px;

}



.section-title{

    font-weight:1000;

    font-size:18px;

    margin:3px 0 12px;

}




/* 输入区域 */

.input-row{

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:15px;

    margin-top:8px;

}



input{

    width:min(100%,360px);

    height:58px;

    border:

    2px solid #e7d2c0;

    border-radius:18px;

    outline:none;

    text-align:center;

    font-size:28px;

    font-weight:900;

    letter-spacing:6px;

    color:#2b2118;

    background:white;

}



input:focus{

    border-color:#d94b3d;

}



button{

    border:none;

    cursor:pointer;

    font-weight:900;

}



.btn-main{

    width:72px;

    height:72px;

    border-radius:50%;

    background:

    linear-gradient(145deg,#d94b3d,#b8342b);

    color:white;

    font-size:18px;

    box-shadow:

    0 10px 22px rgba(217,75,61,.34);

}



.btn-main:active{

    transform:scale(.96);

}



/* 结果 */

.result{

    display:none;

    margin-top:16px;

    background:white;

    border-radius:20px;

    border:

    1px solid #eadccc;

    padding:16px;

    text-align:center;

}


.result.show{

    display:block;

}



.badge{

    display:inline-flex;

    align-items:center;

    padding:7px 10px;

    border-radius:999px;

    font-size:13px;

    font-weight:900;

    background:

    rgba(31,157,103,.12);

    color:#1f9d67;

    border:

    1px solid rgba(31,157,103,.24);

}



.big{

    font-size:32px;

    font-weight:1000;

    margin:15px 0;

}



.desc{

    color:#8a7664;

    line-height:1.7;

    font-size:14px;

}



/* 历史 */

.history-item{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:10px 0;

    border-bottom:

    1px dashed #eadccc;

}



.history-result{

    color:#d94b3d;

    font-weight:900;

}



.btn-clear{

    width:100%;

    height:42px;

    border-radius:12px;

    margin-top:15px;

    background:#efe3d5;

    color:#6b5644;

}



@media(max-width:760px){

    body{

        padding:16px 10px 34px;

    }


    .title{

        font-size:23px;

    }


    .panel{

        padding:14px;

        border-radius:20px;

    }


    input{

        height:56px;

        font-size:25px;

    }


    .btn-main{

        width:64px;

        height:64px;

    }


    .big{

        font-size:26px;

    }

}


</style>

</head>


<body>


<div class="wrap">


<div class="hero">

<div class="title">
抓环机｜房卡规则
</div>


<div class="sub">
房间号 - 49835 ｜ 输出差值结果
</div>


</div>


<div class="panel">


<div class="section-title">
输入5位房间号
</div>



<div class="input-row">


<input
id="roomInput"
type="tel"
inputmode="numeric"
maxlength="5"
placeholder="例如 74019"
/>


<button
class="btn-main"
onclick="run()"
>
计算
</button>


</div>



<div id="result" class="result"></div>


</div>


<div class="panel">


<div class="section-title">

历史记录

<button
class="btn-clear"
onclick="clearHistory()"
>
清空记录
</button>

</div>


<div id="history">

暂无记录

</div>


</div>


</div>


<script>

const KEY = "grab_machine_history";


function run(){

    const input = document.getElementById("roomInput");

    const room = input.value
        .replace(/\D/g,"")
        .slice(0,5);


    if(room.length !== 5){

        showError("请输入完整的5位数字房间号");

        return;

    }



    // 核心规则
    // 房间号 - 49835

    const result = Number(room) - 49835;



    renderResult(room,result);



    saveHistory(room,result);


}




function renderResult(room,result){

    const box = document.getElementById("result");


    box.className="result show";


    box.innerHTML = `


    <span class="badge">
    抓环机｜房卡规则
    </span>


    <div class="big">

    ${room} - 49835 = ${result}

    </div>


    <div class="desc">

    房间号：${room}

    <br>

    基准值：49835

    <br>

    差值结果：

    ${result}

    </div>


    `;


}




function showError(text){

    const box=document.getElementById("result");


    box.className="result show";


    box.innerHTML=`

    <div class="big">
    输入错误
    </div>

    <div class="desc">
    ${text}
    </div>

    `;

}




function saveHistory(room,result){


    let list =
    JSON.parse(
        localStorage.getItem(KEY) || "[]"
    );


    list.unshift({

        room:room,

        result:result,

        time:
        new Date()
        .toLocaleString()

    });



    localStorage.setItem(

        KEY,

        JSON.stringify(
            list.slice(0,50)
        )

    );


    renderHistory();


}





function renderHistory(){


    const box =
    document.getElementById("history");


    let list =
    JSON.parse(
        localStorage.getItem(KEY)||"[]"
    );



    if(list.length===0){

        box.innerHTML="暂无记录";

        return;

    }



    box.innerHTML = list.map(item=>`


    <div class="history-item">


    <div>

    ${item.room}

    </div>



    <div class="history-result">

    ${item.result}

    </div>



    </div>


    `).join("");



}




function clearHistory(){


    localStorage.removeItem(KEY);


    renderHistory();


}




document
.getElementById("roomInput")
.addEventListener("input",function(e){

    e.target.value =
    e.target.value
    .replace(/\D/g,"")
    .slice(0,5);

});



document
.getElementById("roomInput")
.addEventListener("keydown",function(e){

    if(e.key==="Enter"){

        run();

    }

});



renderHistory();


</script>

</body>

</html>
